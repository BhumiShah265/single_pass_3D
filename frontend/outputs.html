<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deliverables · AeroSynth</title><link rel="stylesheet" href="/frontend/app.css"></head><body data-page="outputs"><div class="app-shell"><div id="shell"></div><main class="page"><header class="page-title"><div><span class="eyebrow">Output library</span><h1 class="gradient-text">Deliverables</h1><p>Production geometry, point clouds, rasters, and reports—only shown when the backend confirms the file exists.</p></div><a class="btn btn-secondary" href="/jobs">Browse jobs</a></header><section class="card glass" style="margin-bottom:20px"><div class="grid grid-2"><div><label class="muted" for="jobSelect">Completed project</label><select id="jobSelect" class="select" style="margin-top:8px"><option>Loading…</option></select></div><div style="display:flex;align-items:end"><p id="outputSummary" class="muted">Finding available files…</p></div></div></section><section class="grid grid-4" id="fileGrid"></section></main></div><div class="modal-backdrop" id="newProjectModal"><div class="modal glass"><div class="modal-head"><h2>New project</h2><button class="btn btn-secondary icon-btn" data-modal-close>×</button></div><p class="muted">Create deliverables from a new aerial flight.</p><a class="btn btn-primary" href="/reconstruct">Open reconstruction</a></div></div><script src="/frontend/app.js"></script><script>document.getElementById('shell').innerHTML=Aero.shell();const types=[['obj','OBJ mesh','⬡'],['ply','PLY cloud','⁙'],['las','LAS point cloud','⋮'],['complete','Complete 3D (inferred)','◈'],['glb','GLB model','◈'],['fbx','FBX model','◇'],['orthophoto','GeoTIFF raster','▧'],['dsm','Surface model','⌁'],['report','PDF report','≡']];async function init(){try{const r=await Aero.api('/jobs');const complete=r.jobs.filter(j=>j.status==='completed');const requested=new URLSearchParams(location.search).get('job');jobSelect.innerHTML=complete.length?complete.map(j=>`<option value="${j.job_id}" ${j.job_id===requested?'selected':''}>${j.filename||j.job_id.slice(0,8)}</option>`).join(''):'<option value="">No completed projects</option>';if(complete.length)load(jobSelect.value);else empty()}catch(e){outputSummary.textContent=e.message;empty()}}async function load(id){try{const a=await Aero.api(`/available/${id}`);const available=types.filter(([k])=>a[k]?.exists).length;outputSummary.textContent=`${available} of ${types.length} deliverables available`;fileGrid.innerHTML=types.map(([k,n,icon])=>{const x=a[k]||{};return `<article class="card glass file-card"><span class="feature-icon">${icon}</span><h3>${n}</h3><p>${x.exists?`${(x.size_bytes/1048576).toFixed(2)} MB · Ready`:'Not generated'}</p>${x.exists?`<a class="btn btn-primary" href="/api/v1/download/${id}/${k}">Download</a>`:'<button class="btn btn-secondary" disabled>Unavailable</button>'}</article>`}).join('')}catch(e){outputSummary.textContent=e.message;empty()}}function empty(){fileGrid.innerHTML='<div class="card glass empty" style="grid-column:1/-1">Complete a reconstruction to unlock verified deliverables.</div>'}jobSelect.onchange=()=>jobSelect.value&&load(jobSelect.value);init();</script></body></html>
