<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Neumorphic ring simulation -->
  <circle cx="50" cy="50" r="44" stroke="url(#prismGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85" filter="url(#glow)"/>
  <!-- Isometric 3D wireframe prism / drone flight vector -->
  <path d="M50 18 L78 34 L78 66 L50 82 L22 66 L22 34 Z" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M50 18 L50 50 L78 66 M50 50 L22 66" stroke="#4FACFE" stroke-width="2" opacity="0.9"/>
  <!-- Central optical neural pulse -->
  <circle cx="50" cy="50" r="6" fill="url(#prismGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="14" stroke="#E100FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
</svg>